# Preventative guard for the failure class behind GitHub Actions run
# 36887668901 (D1 monthly restore verification, main, 2026-10-01):
# migration 0036 (donor_source_attributions) landed on this branch --
# which owns fundraising-os-staging-db's real schema -- but `main`'s own,
# separately and manually synced restore-order/schema-baseline tracking
# was never updated, so the next scheduled monthly restore test failed a
# full month after the actual schema change, not when it happened. See
# docs/AI-HANDOFF.md's "D1 Monthly Restore Verification Repair" entries
# for the full incident history.
#
# TWO INDEPENDENT JOBS, each a separate, orthogonal signal -- see
# docs/D1-MIGRATION-SYNC-PROCESS.md for the full design:
#
# `check` -- UNCHANGED since this workflow's own original version. Runs
# scripts/check-main-restore-sync.mjs (generic, derived from
# lib/operations/restore-drift-guard.ts -- never hardcodes a table name),
# comparing this branch's current, freshly-generated schema/restore state
# against `origin/main`'s COMMITTED copy. Read-only (`git show`/`git
# fetch` only). THIS IS THE SOLE AUTHORITY on "is main synchronized?" --
# nothing else in this file ever changes its conclusion. Real drift
# always fails this job, period, with no exception for an automated PR
# existing (see docs/AI-HANDOFF.md's "D1 Migration Sync Automation" entry
# for why this distinction is load-bearing, not cosmetic).
#
# `prepare-sync` -- NEW. Independent of `check`'s own result (`needs:
# check` is only for sequencing/log readability, gated with `if:
# always()` so it runs regardless of whether `check` passed or failed).
# When drift exists, conservatively attempts to generate, validate (main's
# own real `npm test`/`npm run build`, PLUS a fresh re-run of this exact
# same unmodified check-main-restore-sync.mjs against the candidate),
# and -- only if every one of those independently passes -- open or
# update a pull request against `main` carrying the minimal sync. It
# NEVER merges anything, NEVER touches D1, and restricts itself to
# trusted contexts only (`push`/`workflow_dispatch`, never a `pull_request`
# event, so it can never run with write privileges against untrusted
# PR-sourced code -- `check` above stays read-only and still runs for
# `pull_request` exactly as before). `prepare-sync` succeeding means
# either "nothing to do" or "a reviewable fix is ready"; `prepare-sync`
# failing means "drift exists and this automation could not safely
# handle it" -- a genuinely new, actionable problem, never silenced.
#
# This remains the PRIMARY, early-detection line of defense -- the
# monthly restore-verification workflow (d1-restore-verify-monthly.yml,
# which actually restores a real backup into a scratch D1 database)
# remains the independent, periodic, real-backup proof; it is still the
# LAST line of defense, not the first place this class of drift is
# discovered.
name: D1 restore/schema sync check

on:
  push:
    branches:
      - feature/independent-cloudflare-sandbox
    paths:
      - "drizzle/**"
      - "db/schema.ts"
      - "lib/operations/staging-reset.ts"
      - "lib/operations/d1-restore-order.ts"
      - "lib/operations/restore-drift-guard.ts"
      - "lib/operations/restore-sync-generator.ts"
      - "lib/operations/restore-sync-branch-policy.ts"
      - "lib/data-health/production-baseline.ts"
      - "production-baseline/**"
      - "scripts/generate-production-baseline.mjs"
      - "scripts/check-main-restore-sync.mjs"
      - "scripts/prepare-main-restore-sync-patch.mjs"
      - "scripts/open-or-update-sync-pr.mjs"
  pull_request:
    branches:
      - feature/independent-cloudflare-sandbox
    paths:
      - "drizzle/**"
      - "db/schema.ts"
      - "lib/operations/staging-reset.ts"
      - "lib/operations/d1-restore-order.ts"
      - "lib/operations/restore-drift-guard.ts"
      - "lib/operations/restore-sync-generator.ts"
      - "lib/operations/restore-sync-branch-policy.ts"
      - "lib/data-health/production-baseline.ts"
      - "production-baseline/**"
      - "scripts/generate-production-baseline.mjs"
      - "scripts/check-main-restore-sync.mjs"
      - "scripts/prepare-main-restore-sync-patch.mjs"
      - "scripts/open-or-update-sync-pr.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so `origin/main` is a real, fetchable ref for `git show`
          # -- this job never checks main out, only reads its files.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compare this branch's canonical D1 schema/restore state against main
        run: node scripts/check-main-restore-sync.mjs

  # Restricted to trusted contexts only (requirement: never run write-
  # privileged automation on untrusted pull-request code) -- a plain
  # `pull_request` event (even from within this same repo, let alone a
  # fork) never reaches this job at all; only a direct push to the
  # canonical branch, or a manually authorized workflow_dispatch, does.
  # `check` above is unaffected by this restriction -- it stays read-only
  # and still runs for every trigger, `pull_request` included, exactly as
  # before this job existed.
  prepare-sync:
    needs: check
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoped to this one job only -- the repository's own default
    # workflow permissions (read-only) are untouched; this is the
    # standard, intended per-job escalation mechanism, not a repository-
    # wide security change. No permission beyond these two is requested;
    # in particular, never `actions: write`, never anything deployment-
    # or D1-credential-related.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare and, if safe and validated, open/update the main sync PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/open-or-update-sync-pr.mjs --apply
