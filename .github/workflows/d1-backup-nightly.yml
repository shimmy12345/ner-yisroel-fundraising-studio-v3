# Nightly, fully automated backup of fundraising-os-staging-db.
#
# Independent of everything the deployed Worker can do: this workflow runs
# entirely outside the application, using credentials the Worker itself
# never has access to (see wrangler.staging.jsonc -- no R2 binding exists
# there, and never should). A bug or compromise in the deployed app cannot
# reach these backups.
#
# What it does:
#   1. wrangler d1 export -- a full, raw SQL export of the entire remote
#      database (schema + every row in every table). Not the app-level
#      partial JSON export (/api/import/backup) -- this is the whole thing.
#   2. gzip + GPG-encrypt (AES256, symmetric) the export. The plaintext
#      export never leaves the runner and is shredded immediately after.
#   3. Upload to a dedicated R2 bucket via R2's S3-compatible API, using a
#      credential scoped to Object Read & Write on that one bucket only --
#      it cannot touch D1, the Worker, or any other R2 bucket.
#   4. Retention is enforced by an R2 lifecycle rule on the `daily/` prefix
#      (set up once outside this workflow -- see docs/DEPLOYMENT.md), not
#      by this workflow deleting anything itself.
#   5. When promoting the SAME ciphertext to the mutable `latest/` pointer,
#      attaches the immutable `daily/...` key that was just uploaded as
#      that object's own R2 metadata (`dated-backup-key`), in the SAME
#      PutObject call that writes `latest/`'s content -- never a separate
#      write. This makes `latest/` self-identifying: whoever reads it later
#      (see d1-restore-verify-monthly.yml) learns exactly which immutable
#      dated object it corresponds to, from one atomic read, with no
#      separate lookup that could race against a concurrent backup run.
#      Treat this `latest/` promotion as the canonical successful-backup
#      boundary: reaching it (with content and provenance written
#      together) is what "this backup succeeded" means here. It does NOT
#      claim anything about step 6 below (status publication) also having
#      succeeded -- that is a separate, best-effort, informational fact,
#      never a precondition for `latest/` itself being trustworthy.
#   6. Additively, and only after all of the above: publishes a tiny,
#      non-secret status JSON (timestamp, outcome, object key -- never
#      backup content) to a SEPARATE, dedicated status bucket
#      (fundraising-os-backup-status), using its own separately-scoped
#      write credential -- distinct from the R2_BACKUP_WRITE_* credential
#      above, so a leaked status-write credential can never touch real
#      backup content. A failure in this step is logged (::warning::) but
#      is deliberately configured to never fail the job -- status
#      publication must never turn a successful backup into a failed
#      workflow run. Conversely, when the real backup fails, this step
#      still records that failure in the status artifact (via
#      ${{ job.status }}) without masking or altering the job's own
#      failure -- the earlier steps' own outcome, unaffected by this
#      step's own error handling, is what still fails this job.
#
# See docs/DEPLOYMENT.md's "Automated D1 backup (GitHub Actions + R2)"
# section for the required repository secrets and the one-time R2/Cloudflare
# setup this workflow depends on.
name: D1 nightly backup

on:
  schedule:
    # 08:00 UTC daily. Cron schedules on GitHub Actions are best-effort and
    # can be delayed under platform load -- treat "nightly" as "at least
    # once a day", not an exact clock guarantee.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: d1-nightly-backup
  cancel-in-progress: false

env:
  DATABASE_NAME: fundraising-os-staging-db
  WRANGLER_VERSION: "4.92.0"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export D1 database (full, raw SQL)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 export "${DATABASE_NAME}" --remote -y --output=export.sql

      - name: Verify the export before trusting it
        run: |
          set -euo pipefail
          test -s export.sql
          head -c 64 export.sql | grep -q 'PRAGMA defer_foreign_keys=TRUE;' \
            || { echo "::error::Export does not start with the expected PRAGMA line -- refusing to back up a possibly-corrupt export."; exit 1; }
          echo "Export looks structurally sane: $(wc -l < export.sql) lines, $(wc -c < export.sql) bytes."

      - name: Compress and encrypt (plaintext never leaves this step)
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          gzip -c export.sql > export.sql.gz
          PASSFILE="$(mktemp)"
          printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" > "${PASSFILE}"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file "${PASSFILE}" \
            --output export.sql.gz.gpg export.sql.gz
          shred -u "${PASSFILE}" export.sql export.sql.gz
          test -s export.sql.gz.gpg

      - name: Compute timestamp
        id: stamp
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload dated backup to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_WRITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          KEY="daily/${DATABASE_NAME}-${{ steps.stamp.outputs.value }}.sql.gz.gpg"
          aws s3api put-object \
            --endpoint-url "${ENDPOINT_URL}" \
            --bucket "${BUCKET}" \
            --key "${KEY}" \
            --body export.sql.gz.gpg \
            --content-type application/octet-stream
          echo "Uploaded ${KEY}"

      - name: Update the 'latest' pointer (never expires, always overwritten)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_WRITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # dated-backup-key is computed identically to the dated upload
          # step above (same formula, same steps.stamp.outputs.value), so
          # the two are always byte-identical -- and it is attached here,
          # in the SAME PutObject call that writes latest/'s content, so
          # latest/'s content and its provenance metadata can never drift
          # apart: a failed PutObject leaves the previous latest/ (content
          # AND metadata) completely untouched, and a successful one
          # replaces both atomically together. There is no partial-update
          # path in the PutObject operation itself.
          DATED_KEY="daily/${DATABASE_NAME}-${{ steps.stamp.outputs.value }}.sql.gz.gpg"
          aws s3api put-object \
            --endpoint-url "${ENDPOINT_URL}" \
            --bucket "${BUCKET}" \
            --key "latest/${DATABASE_NAME}.sql.gz.gpg" \
            --body export.sql.gz.gpg \
            --content-type application/octet-stream \
            --metadata "dated-backup-key=${DATED_KEY}"

      - name: Clean up local plaintext/ciphertext
        if: always()
        run: rm -f export.sql export.sql.gz export.sql.gz.gpg

      # Additive, best-effort status reporting -- deliberately separate
      # from and after every real backup step above, writing only to the
      # dedicated status bucket (never the backup bucket) with its own,
      # separately-scoped write credential. `continue-on-error: true` is
      # load-bearing: a failure here must never turn a successful backup
      # into a failed workflow run. On failure, whatever status object
      # already exists there simply ages past its freshness threshold
      # rather than being overwritten with a false success.
      - name: Publish backup status (best-effort; must never fail this job)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATUS_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATUS_WRITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          STATUS_BUCKET: ${{ vars.R2_STATUS_BUCKET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BACKUP_OBJECT_KEY="daily/${DATABASE_NAME}-${{ steps.stamp.outputs.value }}.sql.gz.gpg"
          jq -n --arg db "${DATABASE_NAME}" --arg at "${COMPLETED_AT}" --arg status "${JOB_STATUS}" \
                --arg runId "${{ github.run_id }}" --arg runUrl "${RUN_URL}" \
            '{schemaVersion: 1, databaseName: $db, attemptAt: $at, attemptStatus: $status, workflowRunId: $runId, workflowRunUrl: $runUrl}' \
            > attempt.json
          aws s3api put-object \
            --endpoint-url "${ENDPOINT_URL}" --bucket "${STATUS_BUCKET}" \
            --key "backup-latest-attempt.json" --body attempt.json --content-type application/json \
            || echo "::warning::Failed to publish backup-latest-attempt.json -- the backup itself is unaffected."
          if [ "${JOB_STATUS}" = "success" ]; then
            jq -n --arg db "${DATABASE_NAME}" --arg at "${COMPLETED_AT}" --arg key "${BACKUP_OBJECT_KEY}" \
                  --arg runId "${{ github.run_id }}" --arg runUrl "${RUN_URL}" \
              '{schemaVersion: 1, databaseName: $db, completedAt: $at, backupObjectKey: $key, workflowRunId: $runId, workflowRunUrl: $runUrl}' \
              > success.json
            aws s3api put-object \
              --endpoint-url "${ENDPOINT_URL}" --bucket "${STATUS_BUCKET}" \
              --key "backup-latest-success.json" --body success.json --content-type application/json \
              || echo "::warning::Failed to publish backup-latest-success.json -- the backup itself succeeded and is unaffected."
          fi
          rm -f attempt.json success.json
