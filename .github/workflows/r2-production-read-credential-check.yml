# Production R2 read-credential check -- manual, read-only diagnostic.
#
# Purpose: verify that R2_BACKUP_READ_ACCESS_KEY_ID_PRODUCTION /
# R2_BACKUP_READ_SECRET_ACCESS_KEY_PRODUCTION (newly recreated via the
# Cloudflare dashboard, scoped to Object Read on
# fundraising-os-production-backups only) can actually authenticate
# against R2, following a prior restore-verification run
# (38109498404) that failed at this exact step with a 403 on
# HeadObject and SignatureDoesNotMatch on GetObject. This workflow
# does nothing else -- it is not the restore-verification workflow,
# it never decrypts anything, and it never touches any database.
#
# Safe by construction, not just by intent:
#   - Only ever calls HeadObject and GetObject -- both are inherently
#     non-mutating S3/R2 operations. There is no put-object,
#     delete-object, or copy-object call anywhere in this file.
#   - References only the two READ secrets above plus the existing,
#     non-secret CLOUDFLARE_ACCOUNT_ID/R2_BACKUP_BUCKET_PRODUCTION --
#     no write-scoped R2 credential (R2_BACKUP_WRITE_*,
#     R2_STATUS_WRITE_*) and no CLOUDFLARE_D1_API_TOKEN are referenced
#     anywhere, so this workflow cannot write/delete any R2 object and
#     cannot touch any D1 database (Production or Staging) even in
#     principle.
#   - Reads exactly one already-known object
#     (latest/fundraising-os-production-db.sql.gz.gpg) -- no bucket
#     listing, no enumeration of other objects.
#   - Never runs gpg or any decryption; never prints file contents --
#     only a byte count, a SHA-256 checksum, and the first two raw
#     bytes (as hex) to confirm the object still looks like binary
#     ciphertext, not corrupted or accidentally plaintext.
#   - workflow_dispatch only -- no schedule, no push, no pull_request
#     trigger.
name: R2 Production read-credential check (manual, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATABASE_NAME: fundraising-os-production-db
  # Independently verified this round by downloading the same object
  # via Cloudflare's own native API (wrangler r2 object get), a
  # completely separate code path from the AWS-CLI/S3-compatible
  # credential this workflow is testing. Re-verified fresh
  # immediately before this file was written. Comparing against it
  # proves the object retrieved through the credential under test is
  # byte-for-byte the same object, not merely "a successful HTTP 200."
  EXPECTED_SIZE_BYTES: "5746"
  EXPECTED_SHA256: "6f6fe826f3b371a5f0f86a9fb3aee434a91f6659e3e1c0bbc1d26e45d3f3d145"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HeadObject against the existing backup's latest/ pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID_PRODUCTION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY_PRODUCTION }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET_PRODUCTION }}
        run: |
          set -euo pipefail
          aws s3api head-object --endpoint-url "${ENDPOINT_URL}" --bucket "${BUCKET}" \
            --key "latest/${DATABASE_NAME}.sql.gz.gpg"

      - name: GetObject -- download the ciphertext only, never decrypt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID_PRODUCTION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY_PRODUCTION }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET_PRODUCTION }}
        run: |
          set -euo pipefail
          aws s3api get-object --endpoint-url "${ENDPOINT_URL}" --bucket "${BUCKET}" \
            --key "latest/${DATABASE_NAME}.sql.gz.gpg" check.sql.gz.gpg
          test -s check.sql.gz.gpg

      - name: Verify size, checksum, and that the content still looks encrypted
        run: |
          set -euo pipefail
          ACTUAL_SIZE="$(wc -c < check.sql.gz.gpg | tr -d ' ')"
          ACTUAL_SHA256="$(sha256sum check.sql.gz.gpg | cut -d' ' -f1)"
          echo "Downloaded ${ACTUAL_SIZE} bytes."
          echo "First two bytes (hex): $(head -c 2 check.sql.gz.gpg | od -An -tx1 | tr -d ' ')"
          if [ "${ACTUAL_SIZE}" != "${EXPECTED_SIZE_BYTES}" ]; then
            echo "::error::Size mismatch -- expected ${EXPECTED_SIZE_BYTES} bytes, got ${ACTUAL_SIZE}."
            exit 1
          fi
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::SHA-256 mismatch against the independently-verified checksum -- the object retrieved through this credential does not match the known-good backup."
            exit 1
          fi
          echo "Size and SHA-256 both match the independently-verified backup object. Read credential confirmed working against the correct object."

      - name: Clean up
        if: always()
        run: rm -f check.sql.gz.gpg
