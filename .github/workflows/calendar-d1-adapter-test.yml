# Runs the Google Calendar D1 persistence adapter's own contract/
# concurrency test suite (tests/calendar-d1-store.test.mjs and
# tests/calendar-adapters-integration.test.mjs), plus (2026-10-19, Trip
# Planning narrowed first release) the Trip Planning wiring layer's own
# full schedule/reschedule/cancel path against a STATEFUL simulated
# Google calendar (tests/trip-calendar-sync-integration.test.mjs), plus
# (2026-10-19, second follow-up review) tests/trip-entrypoints-
# atomicity.test.mjs -- the ACTUAL application entry points
# (scheduleProspectMeeting/setSimpleProspectStatus/
# retryTripMeetingCalendarSync), reached via a Node ESM loader hook that
# stubs the "cloudflare:workers" module these functions import (see
# tests/fixtures/cloudflare-workers-loader.mjs) -- against a REAL local
# Workers/D1 runtime (wrangler's own getPlatformProxy(), per
# lib/calendar/testing/local-d1.ts) on an Ubuntu runner, plus (2026-10-19,
# sixth follow-up review) tests/calendar-schema-repair-rehearsal.test.mjs
# -- rehearses the NOT-YET-APPLIED drizzle/pending-review/0049_fix_
# calendar_schema_text_staging_repair.sql draft against a real local D1:
# reproduces the pre-fix buggy Staging schema with synthetic data, applies
# the repair via a single db.batch(), and verifies data/index/constraint
# preservation, a clean foreign_key_check/integrity_check, the real
# schema-backup/restore path, and atomic rollback on a forced failure --
# extended (2026-10-19, seventh follow-up review) to also rehearse the
# real recovery procedure (lib/operations/calendar-schema-repair-
# recovery.ts) against real local D1, and to inject a guaranteed failure
# into the REAL parsed repair statements at three points (early, right
# after a real DROP TABLE, and late in the second rebuild pass), each
# against its own fresh database, proving rollback is total even deep
# into the batch and that a corrected retry still succeeds afterward.
# Never applies anything to Staging or Production.
#
# Why this workflow exists, and why it runs on Linux rather than wherever
# the rest of this repo's CI/local dev happens: this project's own
# Windows development sandbox cannot run the bundled workerd.exe binary
# at all (it crashes immediately with a Windows structured exception;
# getPlatformProxy() then hangs rather than surfacing that failure --
# see docs/AI-HANDOFF.md for the full finding). The D1 adapter itself,
# and this test suite, are platform-agnostic; only the LOCAL TEST RUNTIME
# needed Linux. Nothing here applies to, or is required for, the real
# production D1 database (wrangler.production.jsonc) -- this workflow
# never touches it, never authenticates to Cloudflare, and never deploys
# anything.
#
# Scope, deliberately narrow:
# - `persist: false` + `remoteBindings: false` (local-d1.ts's own
#   getPlatformProxy() call) -- every run gets a fresh, in-process-only
#   database; no remote Cloudflare D1 access, ever, from this workflow.
# - No Google credentials of any kind are used, read, or referenced --
#   the D1 adapter tests never touch Google at all, and
#   calendar-adapters-integration.test.mjs's Google Calendar client is
#   exercised ENTIRELY through MockHttpTransport (lib/calendar/testing/
#   mock-http-transport.ts), never a real network call.
# - `permissions: contents: read` only -- no write access, no
#   `secrets.*` reference anywhere in this file, no deployment step.
# - Triggers only on this feature branch and workflow_dispatch -- never
#   touches main, never runs as part of any existing workflow.
name: Calendar D1 adapter test

on:
  push:
    branches:
      - feature/independent-cloudflare-sandbox
    paths:
      - "lib/calendar/**"
      - "lib/relationships/trip-calendar-sync.ts"
      - "lib/relationships/trips-data.ts"
      - "lib/relationships/trip-model.ts"
      - "tests/calendar-d1-store.test.mjs"
      - "tests/calendar-adapters-integration.test.mjs"
      - "tests/calendar-google-client.test.mjs"
      - "tests/trip-calendar-sync-integration.test.mjs"
      - "tests/trip-entrypoints-atomicity.test.mjs"
      - "tests/calendar-schema-repair-rehearsal.test.mjs"
      - "tests/fixtures/wrangler.calendar-d1-test.jsonc"
      - "tests/fixtures/cloudflare-workers-loader.mjs"
      - "tests/fixtures/fake-cloudflare-workers.mjs"
      - "drizzle/0048_google_calendar_sync.sql"
      - "drizzle/pending-review/0049_fix_calendar_schema_text_staging_repair.sql"
      - "lib/operations/calendar-schema-repair-recovery.ts"
      - "lib/operations/calendar-schema-repair-apply.ts"
      - "lib/operations/d1-backup-rows.ts"
      - "lib/operations/staging-repair-target.ts"
      - "tests/calendar-schema-repair-recovery.test.mjs"
      - "tests/staging-repair-target-validation.test.mjs"
      - "tests/calendar-schema-repair-apply.test.mjs"
      - "scripts/apply-0049-calendar-schema-repair-staging.mjs"
      - "scripts/recover-0049-calendar-schema-repair-staging.mjs"
      - "scripts/diagnose-staging-connection.mjs"
      - "scripts/lib/staging-repair-connect.mjs"
      - "tests/staging-repair-connect-args.test.mjs"
      - "scripts/lib/backup-retention.mjs"
      - "wrangler.staging-repair.jsonc"
      - ".github/workflows/d1-restore-verify-monthly.yml"
      - "cloudflare-env.d.ts"
      - "scripts/ci/calendar-d1-smoke-test.mjs"
      - ".github/workflows/calendar-d1-adapter-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  calendar-d1-adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bounded smoke test first, per this phase's own explicit
      # instruction: proves the local Workers/D1 runtime actually starts
      # on this runner before spending time on the full suite. The step-
      # level timeout-minutes is the hard timeout/reliable-cleanup
      # mechanism -- a hang here fails the step (and the job) rather than
      # ever hanging a CI run indefinitely, exactly the failure mode this
      # phase found on the Windows sandbox.
      - name: Smoke test -- local D1 runtime starts
        timeout-minutes: 3
        run: pnpm run test:calendar-d1-smoke

      # Always publishes a bounded excerpt of this step's own output to
      # the job summary -- pass or fail -- so the result is readable
      # directly from the Actions run page without needing authenticated
      # log access. Safe to publish verbatim: this workflow references no
      # `secrets.*` anywhere and the D1 adapter tests never touch Google
      # or any credential, so there is nothing secret in this output to
      # redact. `exit "$status"` at the end preserves the test run's own
      # real exit code regardless of whether writing the summary itself
      # succeeds -- a failing test still fails this step and the job.
      - name: D1 adapter contract/concurrency tests + integration + real entry-point atomicity tests
        timeout-minutes: 10
        run: |
          set +e
          pnpm run test:calendar-d1 2>&1 | tee /tmp/d1-adapter-test-output.log
          status=${PIPESTATUS[0]}
          {
            echo "## D1 adapter test output"
            echo '```'
            tail -n 300 /tmp/d1-adapter-test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Runs regardless of whether the D1 step above passed or failed
      # (but not if the job was cancelled) -- a D1/workerd-runtime problem
      # must never prevent independently verifying the mocked-transport
      # Google Calendar client, which has no dependency on D1 at all.
      # Also already runs on every platform via `pnpm test`; repeated
      # here so a single CI run's log/summary is the complete,
      # self-contained evidence trail for this phase.
      - name: Google Calendar client tests (mocked transport)
        if: ${{ !cancelled() }}
        run: node tests/calendar-google-client.test.mjs && node tests/calendar-oauth-error-code.test.mjs
