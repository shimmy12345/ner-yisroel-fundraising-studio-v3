# Monthly, fully automated proof that the backup pipeline's output actually
# restores and is intact -- a backup nobody has ever restored is a
# hypothesis, not a backup. This is a periodic spot-check of the PIPELINE,
# not a per-backup gate: it does not run after every nightly backup, and a
# newer nightly backup existing than the one most recently restore-tested
# is normal, expected, and not itself a problem (see docs/DEPLOYMENT.md).
# This workflow:
#   0. Reads the mutable `latest/...` object's own R2 metadata (ONE
#      HeadObject call, using the existing read-only backup-bucket
#      credential -- no new secret, and R2_STATUS_WRITE_* is never
#      referenced anywhere in this job except the final publish step) to
#      learn `dated-backup-key`: the specific immutable `daily/...` object
#      the nightly backup workflow most recently promoted to `latest/`.
#      That metadata is written by d1-backup-nightly.yml in the SAME
#      PutObject call that writes `latest/`'s content -- never a separate
#      write -- so `latest/`'s content and its provenance can never drift
#      apart from each other: a failed PutObject leaves the previous
#      `latest/` (content AND metadata) completely untouched, and a
#      successful one replaces both atomically together.
#
#      Terminology: treat `latest/` promotion as the canonical
#      successful-backup boundary. Reading valid `dated-backup-key`
#      metadata proves the backup pipeline reached that promotion step
#      with content and provenance written together -- it does NOT prove
#      every later bookkeeping/status-publish step of that GitHub Actions
#      job also succeeded (that's a separate, best-effort, informational
#      fact -- see d1-backup-nightly.yml's own header comment).
#
#      This value is NEVER trusted merely because it's present: it is
#      validated against an exact allowlist pattern
#      (daily/<DATABASE_NAME>-YYYYMMDDTHHMMSSZ.sql.gz.gpg) before use --
#      rejecting any other prefix, any other database name, path
#      traversal, embedded whitespace/newlines, shell metacharacters, a
#      malformed timestamp shape, or any other arbitrary key. Anything
#      that fails validation (including an unreadable/absent HEAD
#      response, e.g. a `latest/` object that predates this feature) is
#      treated exactly like no metadata existed at all -- the
#      tested-backup identity for this run is recorded as unknown, never
#      guessed.
#
#      Race-condition note: `latest/...` itself is still a MUTABLE
#      pointer, overwritten by every nightly backup run (a separate
#      concurrency group from this workflow, so the two CAN run
#      concurrently). But this workflow performs exactly ONE HeadObject on
#      `latest/` for the entire job -- it never re-reads `latest/` to
#      "double check" the identity. R2 (like S3) gives strong per-object
#      read consistency, so that one HEAD call returns one coherent
#      (content, metadata) snapshot; it can never observe new content with
#      stale metadata or vice versa, because both are written by the same
#      atomic PutObject. Once step 1 below captures the validated dated
#      key, that key refers to an IMMUTABLE object (daily/... keys are
#      never overwritten, only new ones added) -- so no matter how many
#      times a concurrent or later backup run overwrites `latest/` after
#      this job's one HEAD call, it cannot change which object this run
#      downloads and restores.
#   1. Downloads that validated dated object if step 0 established its
#      identity; otherwise falls back to downloading `latest/...` directly
#      (same read-only credential), still proving the pipeline produces a
#      restorable backup even though this run can't name which dated
#      backup it was. verifiedBackupCompletedAt's one canonical source is
#      the immutable dated object's own LastModified, read directly from
#      this same GetObject response -- never a second API call, never
#      parsed back out of the key string.
#   2. Decrypts and decompresses it.
#   3. Restores it into a brand-new, throwaway remote D1 database (never
#      the real fundraising-os-staging-db).
#   4. Runs PRAGMA integrity_check, PRAGMA foreign_key_check, a full schema
#      comparison against the verified production baseline, and a
#      per-table row-count sanity check across every fundraising table.
#   5. Deletes the scratch database, always -- including when a check
#      fails, via scripts/verify-remote-restore.mjs's try/finally.
#   6. Additively, and only after all of the above: publishes a tiny
#      non-secret status JSON (timestamp, outcome, which backup object was
#      verified -- never restored content) to a SEPARATE, dedicated status
#      bucket, using its own separately-scoped write credential. This job
#      still holds no write access to the real backup bucket. See
#      status-worker/ and docs/DEPLOYMENT.md's "Backup/restore status
#      reporting" section. A failure in this step is logged but never
#      fails the job -- it must never be possible for status publication
#      to turn a successful restore verification into a failed one. When
#      the tested-backup identity is unknown (step 0/1 fallback), the
#      published success record says so explicitly (null fields) rather
#      than fabricating a date -- see lib/data-health/model.ts's
#      restoreVerificationCheck, which is the only place this is displayed.
#
# Any failure in steps 1-5 fails this job (red X + whatever notification
# settings this repository/org has configured for Actions failures) --
# there is no soft-fail path. Step 0's own metadata read/validation never
# fails the job by itself (an unreadable or invalid result just means
# "identity unknown" going into step 1), by design (see above). See
# docs/DEPLOYMENT.md's "Automated D1 backup" section for the required
# secrets and one-time setup.
name: D1 monthly restore verification

on:
  schedule:
    # 09:00 UTC on the 1st of every month -- after the nightly backup job,
    # never before it.
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: d1-monthly-restore-verify
  cancel-in-progress: false

env:
  DATABASE_NAME: fundraising-os-staging-db
  WRANGLER_VERSION: "4.92.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install AWS CLI (R2's S3-compatible client)
        run: |
          set -euo pipefail
          command -v aws >/dev/null 2>&1 || pip install --quiet awscli

      - name: Determine and validate the immutable backup identity from latest/'s metadata
        id: identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          set -uo pipefail
          # Design C -- see the header comment for the full race-condition
          # and terminology analysis. This is the ONLY HeadObject call
          # against latest/ in this job; the key captured (and strictly
          # validated) here is what step 1 restores, never re-derived from
          # a second HEAD. Uses only the existing read-only backup-bucket
          # credential -- R2_STATUS_WRITE_* is never referenced here.
          echo "known=false" >> "$GITHUB_OUTPUT"
          if aws s3api head-object --endpoint-url "${ENDPOINT_URL}" --bucket "${BUCKET}" --key "latest/${DATABASE_NAME}.sql.gz.gpg" > latest-head.json; then
            DATED_KEY="$(jq -r '.Metadata["dated-backup-key"] // empty' latest-head.json)"
            # Strict allowlist validation -- never trust R2 metadata merely
            # because it is present. Must match exactly
            # "daily/<DATABASE_NAME>-YYYYMMDDTHHMMSSZ.sql.gz.gpg", full
            # string, nothing else: no other prefix, no other database
            # name, no path traversal, no embedded whitespace/newlines, no
            # shell metacharacters, no malformed timestamp shape, no
            # arbitrary key. Anything that doesn't match exactly is
            # rejected -- identity stays unknown, never guessed.
            VALID=false
            if [ -n "${DATED_KEY}" ] && [ "$(printf '%s' "${DATED_KEY}" | wc -l)" = "0" ]; then
              EXPECTED_PATTERN="^daily/${DATABASE_NAME}-[0-9]{8}T[0-9]{6}Z\.sql\.gz\.gpg\$"
              if [[ "${DATED_KEY}" =~ ${EXPECTED_PATTERN} ]]; then
                VALID=true
              fi
            fi
            if [ "${VALID}" = "true" ]; then
              {
                echo "known=true"
                echo "key=${DATED_KEY}"
              } >> "$GITHUB_OUTPUT"
            else
              echo "::warning::latest/'s dated-backup-key metadata is missing or does not match the expected form -- falling back to latest/ with unknown tested-backup identity."
            fi
          else
            echo "::warning::Could not HEAD latest/ -- falling back to a direct download attempt with unknown tested-backup identity."
          fi
          rm -f latest-head.json

      - name: Download the backup object to verify
        id: download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          IDENTITY_KNOWN: ${{ steps.identity.outputs.known }}
          IDENTITY_KEY: ${{ steps.identity.outputs.key }}
        run: |
          set -uo pipefail
          # Restores the SAME validated immutable key captured in the
          # identity step above -- no second HEAD of latest/, no
          # re-derivation. Only falls back to the mutable latest/ pointer
          # when that identity could not be established or that specific
          # object could not be downloaded; the fallback still proves the
          # pipeline produces a restorable backup, just without a provable
          # dated identity.
          DOWNLOADED=false
          KNOWN=false
          TESTED_AT=""
          if [ "${IDENTITY_KNOWN}" = "true" ]; then
            if aws s3api get-object --endpoint-url "${ENDPOINT_URL}" --bucket "${BUCKET}" --key "${IDENTITY_KEY}" latest.sql.gz.gpg > download-response.json; then
              DOWNLOADED=true
              KNOWN=true
              # verifiedBackupCompletedAt's one canonical source: the
              # immutable dated object's own LastModified, read directly
              # from this same GetObject response -- never a second API
              # call, never parsed back out of the key string. Reformatted
              # to this system's usual Z-suffixed UTC shape for
              # consistency with every other published timestamp.
              RAW_LAST_MODIFIED="$(jq -r '.LastModified // empty' download-response.json)"
              if [ -n "${RAW_LAST_MODIFIED}" ]; then
                TESTED_AT="$(date -u -d "${RAW_LAST_MODIFIED}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
              fi
              if [ -z "${TESTED_AT}" ]; then
                # Both fields of an identity are published together or not
                # at all -- never a key with no matching date.
                echo "::warning::Could not determine the restored object's LastModified -- tested-backup identity recorded as unknown for this run."
                KNOWN=false
              fi
            else
              echo "::warning::Could not download the specific dated backup object (${IDENTITY_KEY}) -- falling back to latest/ with unknown tested-backup identity."
            fi
          fi
          if [ "${DOWNLOADED}" != "true" ]; then
            if ! aws s3api get-object --endpoint-url "${ENDPOINT_URL}" --bucket "${BUCKET}" --key "latest/${DATABASE_NAME}.sql.gz.gpg" latest.sql.gz.gpg; then
              echo "::error::Could not download any backup object (neither the specific dated object nor latest/) -- nothing to restore-test."
              exit 1
            fi
          fi
          test -s latest.sql.gz.gpg || { echo "::error::Downloaded backup object is empty."; exit 1; }
          rm -f download-response.json
          {
            echo "known=${KNOWN}"
            if [ "${KNOWN}" = "true" ]; then
              echo "key=${IDENTITY_KEY}"
              echo "at=${TESTED_AT}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Decrypt and decompress
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          PASSFILE="$(mktemp)"
          printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" > "${PASSFILE}"
          gpg --batch --yes --decrypt --passphrase-file "${PASSFILE}" --output latest.sql.gz latest.sql.gz.gpg
          gunzip -c latest.sql.gz > latest.sql
          shred -u "${PASSFILE}" latest.sql.gz.gpg latest.sql.gz
          test -s latest.sql
          head -c 64 latest.sql | grep -q 'PRAGMA defer_foreign_keys=TRUE;' \
            || { echo "::error::Decrypted backup does not start with the expected PRAGMA line -- refusing to restore a possibly-corrupt file."; exit 1; }

      - name: Restore into a scratch D1 database and run every integrity check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-remote-restore.mjs -- latest.sql

      - name: Clean up local files
        if: always()
        run: rm -f latest.sql.gz.gpg latest.sql.gz latest.sql

      # Additive, best-effort status reporting for Workspace Health --
      # deliberately separate from and after every real verification step
      # above, writing only to the dedicated status bucket (never the
      # backup bucket, and this job still holds no write credential to the
      # backup bucket at all -- only R2_BACKUP_READ_* above, unchanged).
      # `continue-on-error: true` is load-bearing: a failure here must
      # never turn a genuinely successful restore verification into a
      # failed workflow run. This does not read or alter anything computed
      # by scripts/verify-remote-restore.mjs -- it only records whether the
      # "Restore into a scratch D1 database and run every integrity check"
      # step above this one succeeded, via ${{ job.status }}, which by this
      # point in the job accurately reflects that step's own outcome.
      - name: Publish restore-verification status (best-effort; must never fail this job)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATUS_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATUS_WRITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          STATUS_BUCKET: ${{ vars.R2_STATUS_BUCKET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_KNOWN: ${{ steps.download.outputs.known }}
          TESTED_KEY: ${{ steps.download.outputs.key }}
          TESTED_AT: ${{ steps.download.outputs.at }}
        run: |
          set -uo pipefail
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LATEST_KEY="latest/${DATABASE_NAME}.sql.gz.gpg"
          jq -n --arg db "${DATABASE_NAME}" --arg at "${COMPLETED_AT}" --arg status "${JOB_STATUS}" \
                --arg runId "${{ github.run_id }}" --arg runUrl "${RUN_URL}" \
            '{schemaVersion: 1, databaseName: $db, attemptAt: $at, attemptStatus: $status, workflowRunId: $runId, workflowRunUrl: $runUrl}' \
            > attempt.json
          aws s3api put-object \
            --endpoint-url "${ENDPOINT_URL}" --bucket "${STATUS_BUCKET}" \
            --key "restore-latest-attempt.json" --body attempt.json --content-type application/json \
            || echo "::warning::Failed to publish restore-latest-attempt.json -- restore verification's own result is unaffected."
          if [ "${JOB_STATUS}" = "success" ]; then
            # verifiedLatestObjectKey is always known (what this run
            # targeted, conceptually). verifiedBackupObjectKey/
            # verifiedBackupCompletedAt are the SPECIFIC immutable dated
            # object actually restored -- present only when "Download the
            # backup object to verify" established that identity with
            # certainty; explicit JSON null otherwise, never a guess, so
            # Workspace Health can never present an unknown backup as a
            # known dated one (see lib/data-health/model.ts).
            if [ "${TESTED_KNOWN}" = "true" ]; then
              jq -n --arg db "${DATABASE_NAME}" --arg at "${COMPLETED_AT}" --arg latestKey "${LATEST_KEY}" \
                    --arg backupKey "${TESTED_KEY}" --arg backupAt "${TESTED_AT}" \
                    --arg runId "${{ github.run_id }}" --arg runUrl "${RUN_URL}" \
                '{schemaVersion: 1, databaseName: $db, completedAt: $at, verifiedLatestObjectKey: $latestKey, verifiedBackupObjectKey: $backupKey, verifiedBackupCompletedAt: $backupAt, workflowRunId: $runId, workflowRunUrl: $runUrl}' \
                > success.json
            else
              jq -n --arg db "${DATABASE_NAME}" --arg at "${COMPLETED_AT}" --arg latestKey "${LATEST_KEY}" \
                    --arg runId "${{ github.run_id }}" --arg runUrl "${RUN_URL}" \
                '{schemaVersion: 1, databaseName: $db, completedAt: $at, verifiedLatestObjectKey: $latestKey, verifiedBackupObjectKey: null, verifiedBackupCompletedAt: null, workflowRunId: $runId, workflowRunUrl: $runUrl}' \
                > success.json
            fi
            aws s3api put-object \
              --endpoint-url "${ENDPOINT_URL}" --bucket "${STATUS_BUCKET}" \
              --key "restore-latest-success.json" --body success.json --content-type application/json \
              || echo "::warning::Failed to publish restore-latest-success.json -- restore verification itself succeeded and is unaffected."
          fi
          rm -f attempt.json success.json
